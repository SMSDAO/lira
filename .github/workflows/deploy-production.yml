name: Production Validation & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_contracts:
        description: 'Deploy smart contracts (requires PRIVATE_KEY secret)'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']
      run_migrations:
        description: 'Run database migrations (requires DATABASE_URL secret)'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  frontend:
    name: Step 1 – Frontend Validation & Build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      NODE_ENV: production
      DATABASE_URL: postgresql://ci-user:ci-pass@localhost:5432/lira
      JWT_SECRET: 0123456789abcdef0123456789abcdef
      SESSION_SECRET: 0123456789abcdef0123456789abcdef
      NEXT_PUBLIC_WALLET_CONNECT_ID: 00000000000000000000000000000000
      ADMIN_ADDRESSES: 0x1111111111111111111111111111111111111111,0x2222222222222222222222222222222222222222
      NEXT_PUBLIC_ADMIN_ADDRESSES: 0x1111111111111111111111111111111111111111,0x2222222222222222222222222222222222222222
      NEXT_PUBLIC_ADMIN_WALLET: 0x1111111111111111111111111111111111111111
      NEXT_PUBLIC_CHAIN_ID: 8453
      NEXT_PUBLIC_CHAIN_NAME: base
      NEXT_PUBLIC_RPC_BASE_MAINNET: https://mainnet.base.org
      NEXT_PUBLIC_RPC_BASE_SEPOLIA: https://sepolia.base.org
      NEXT_PUBLIC_LIRA_TOKEN: 0x1111111111111111111111111111111111111111
      NEXT_PUBLIC_LIRA_REGISTRY: 0x2222222222222222222222222222222222222222
      NEXT_PUBLIC_LIRA_PROFILE: 0x3333333333333333333333333333333333333333
      NEXT_PUBLIC_LIRA_SOCIAL_GRAPH: 0x4444444444444444444444444444444444444444
      NEXT_PUBLIC_FACTORY: 0x5555555555555555555555555555555555555555
      NEXT_PUBLIC_USER_FACTORY: 0x6666666666666666666666666666666666666666

    steps:
      - uses: actions/checkout@v4

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: |
          for i in 1 2 3; do
            npm ci && break || sleep 15;
          done

      - name: Validate environment
        run: npm run env:validate

      - name: Lint
        run: npm run lint --if-present

      - name: Typecheck
        run: npm run typecheck --if-present

      - name: Run frontend tests
        run: npm test -- --runInBand --passWithNoTests
        env:
          CI: true

      - name: Build Next.js application
        run: npm run build

      - name: Upload frontend build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nextjs-build
          path: .next/
          retention-days: 7

  backend:
    name: Step 2 – Backend & Smart Contracts Deploy
    runs-on: ubuntu-latest
    needs: frontend
    timeout-minutes: 35
    env:
      NODE_ENV: production
      DATABASE_URL: postgresql://ci-user:ci-pass@localhost:5432/lira
      JWT_SECRET: 0123456789abcdef0123456789abcdef
      SESSION_SECRET: 0123456789abcdef0123456789abcdef
      NEXT_PUBLIC_WALLET_CONNECT_ID: 00000000000000000000000000000000
      ADMIN_ADDRESSES: 0x1111111111111111111111111111111111111111,0x2222222222222222222222222222222222222222
      NEXT_PUBLIC_ADMIN_ADDRESSES: 0x1111111111111111111111111111111111111111,0x2222222222222222222222222222222222222222
      NEXT_PUBLIC_ADMIN_WALLET: 0x1111111111111111111111111111111111111111
      NEXT_PUBLIC_CHAIN_ID: 8453
      NEXT_PUBLIC_CHAIN_NAME: base
      NEXT_PUBLIC_RPC_BASE_MAINNET: https://mainnet.base.org
      NEXT_PUBLIC_RPC_BASE_SEPOLIA: https://sepolia.base.org
      NEXT_PUBLIC_LIRA_TOKEN: 0x1111111111111111111111111111111111111111
      NEXT_PUBLIC_LIRA_REGISTRY: 0x2222222222222222222222222222222222222222
      NEXT_PUBLIC_LIRA_PROFILE: 0x3333333333333333333333333333333333333333
      NEXT_PUBLIC_LIRA_SOCIAL_GRAPH: 0x4444444444444444444444444444444444444444
      NEXT_PUBLIC_FACTORY: 0x5555555555555555555555555555555555555555
      NEXT_PUBLIC_USER_FACTORY: 0x6666666666666666666666666666666666666666

    steps:
      - uses: actions/checkout@v4

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: |
          for i in 1 2 3; do
            npm ci && break || sleep 15;
          done

      - name: Validate environment
        run: npm run env:validate

      - name: Run smart contract tests
        run: npx hardhat test

      - name: Compile contracts
        run: npx hardhat compile

      - name: Deploy LiraToken, LiraTokenRegistry, TokenLaunchFactory, AgentExecutor
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_contracts == 'true' && secrets.PRIVATE_KEY != '' }}
        run: npx hardhat run scripts/deploy/deploy.js --network ${{ vars.DEPLOY_NETWORK || 'baseSepolia' }}
        env:
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          BASE_RPC_URL: ${{ secrets.BASE_RPC_URL || 'https://mainnet.base.org' }}
          BASE_SEPOLIA_RPC_URL: ${{ secrets.BASE_SEPOLIA_RPC_URL || 'https://sepolia.base.org' }}
          TREASURY_ADDRESS: ${{ secrets.TREASURY_ADDRESS || '' }}
          FEE_COLLECTOR_ADDRESS: ${{ secrets.FEE_COLLECTOR_ADDRESS || '' }}
          BASESCAN_API_KEY: ${{ secrets.BASESCAN_API_KEY || '' }}

      - name: Upload deployment addresses
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_contracts == 'true' && secrets.PRIVATE_KEY != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: deployment-addresses
          path: deployments/
          if-no-files-found: ignore
          retention-days: 30

      - name: Run database migrations
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_migrations == 'true' && secrets.DATABASE_URL != '' }}
        run: npm run db:migrate:deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Set up PHP
        if: hashFiles('backend/php/**') != ''
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Build PHP backend
        if: hashFiles('backend/php/composer.json') != ''
        run: |
          cd backend/php
          composer install --no-dev --optimize-autoloader

      - name: Set up Go
        if: hashFiles('backend/go/**') != ''
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build Go backend
        if: hashFiles('backend/go/go.mod') != ''
        run: |
          cd backend/go
          go build -o bin/lira-api ./cmd/api

      - name: Set up Java
        if: hashFiles('backend/java/**') != ''
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build Java backend
        if: hashFiles('backend/java/pom.xml') != ''
        run: |
          cd backend/java
          mvn --no-transfer-progress clean package -DskipTests

      - name: Health check – frontend build artifact present
        run: |
          if [ -d ".next" ]; then
            echo "✅ Next.js build artifact exists"
          else
            echo "ℹ️  .next directory not present on this runner"
          fi

      - name: Health check – deployment addresses recorded
        run: |
          if [ -d "deployments" ] && [ -n "$(ls -A deployments 2>/dev/null)" ]; then
            echo "✅ Deployment address files:"
            ls -la deployments/
          else
            echo "ℹ️  No deployment files (contract deploy skipped – PRIVATE_KEY not set)"
          fi
